<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Premium Cyberpunk Gesture Visualizer — Neon Energy Threads, Vector Projection Cyber-Rain, Gesture Attractors, and Aspect Centering.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net; media-src 'self' blob: data:;">
  <title>Energy Threads — Hand Gesture Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050508;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      color: #c0c0d0;
      height: 100vh;
      width: 100vw;
    }

    #webcam { display: none; }
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #vignette {
      position: fixed; inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.65) 100%);
      z-index: 3;
    }

    #scanlines {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 4;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.035) 2px, rgba(0, 0, 0, 0.035) 4px);
    }

    /* HUD Top Bar */
    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(180deg, rgba(5,5,8,0.9) 0%, rgba(5,5,8,0.4) 60%, transparent 100%);
      pointer-events: none;
    }
    #hud * { pointer-events: auto; }
    
    .hud-left {
      display: flex; align-items: center; gap: 20px;
    }
    #hud h1 {
      font-family: 'Orbitron', sans-serif; font-weight: 900;
      font-size: 1.1rem; letter-spacing: 4px; text-transform: uppercase;
      background: linear-gradient(90deg, #00f0ff, #b366ff, #ff3399);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    /* Webcam Selector */
    .cam-selector {
      background: rgba(10, 10, 15, 0.6);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 6px;
      color: #9090b0;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem;
      padding: 6px 12px;
      outline: none;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.3s;
      backdrop-filter: blur(8px);
    }
    .cam-selector:hover, .cam-selector:focus {
      border-color: rgba(0, 240, 255, 0.6);
      color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
    }

    .hud-right {
      display: flex; align-items: center; gap: 16px;
    }

    /* Gesture badge */
    #gesture-badge {
      font-family: 'Orbitron', sans-serif; font-size: 0.6rem;
      letter-spacing: 2px; text-transform: uppercase;
      padding: 6px 16px; border-radius: 20px;
      border: 1px solid transparent; background: transparent;
      transition: all 0.4s;
      white-space: nowrap;
      opacity: 0; transform: translateY(-5px);
    }
    #gesture-badge.vis {
      opacity: 1; transform: translateY(0);
      border-color: var(--gc, #00f0ff);
      background: rgba(0, 240, 255, 0.05);
      color: var(--gc, #00f0ff);
      box-shadow: 0 0 15px color-mix(in srgb, var(--gc, #00f0ff) 40%, transparent);
    }

    #status {
      font-family: 'Orbitron', sans-serif; font-size: 0.65rem;
      letter-spacing: 2px; text-transform: uppercase;
      display: flex; align-items: center; gap: 8px;
    }
    #status-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #333;
      transition: background 0.3s, box-shadow 0.3s;
    }
    #status-dot.active {
      background: #00f0ff;
      box-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff80;
    }

    /* Large Gesture Emoji */
    #gesture-emoji {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      font-size: 150px;
      pointer-events: none;
      z-index: 8;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 0 40px rgba(0, 240, 255, 0.25));
    }
    #gesture-emoji.vis {
      opacity: 0.65;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Cyberpunk Music Player in HUD */
    .cyber-player {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(10, 10, 15, 0.65);
      border: 1px solid rgba(179, 102, 255, 0.2);
      border-radius: 6px;
      padding: 4px 10px;
      pointer-events: auto;
      backdrop-filter: blur(8px);
      transition: border-color 0.3s;
    }
    .cyber-player:hover {
      border-color: rgba(179, 102, 255, 0.5);
    }
    .player-select {
      background: transparent;
      border: none;
      color: #b366ff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.58rem;
      letter-spacing: 1px;
      outline: none;
      cursor: pointer;
      max-width: 140px;
    }
    .player-btn {
      background: transparent;
      border: none;
      color: #b366ff;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
      transition: transform 0.2s, color 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .player-btn:hover {
      color: #ff3399;
      transform: scale(1.15);
    }
    .file-loader {
      display: none;
    }
    .file-loader-label {
      font-size: 0.7rem;
      color: #b366ff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.2s;
    }
    .file-loader-label:hover {
      color: #ff3399;
    }

    /* Master Volume Side Overlay Indicator */
    #vol-wrap {
      position: fixed;
      left: 36px;
      top: 50%;
      transform: translateY(-50%) translateX(-40px);
      width: 14px;
      height: 220px;
      background: rgba(10, 10, 15, 0.5);
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 20px;
      z-index: 15;
      padding: 3px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
      pointer-events: none;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }
    #vol-wrap.vis {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }
    #vol-fill {
      width: 100%;
      height: 50%;
      border-radius: 10px;
      background: linear-gradient(to top, #00f0ff, #b366ff, #ff3399);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
      transition: height 0.08s ease-out;
    }
    #vol-pct {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.58rem;
      color: #00f0ff;
      letter-spacing: 1px;
    }
    #vol-label {
      position: absolute;
      bottom: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.48rem;
      color: #b366ff;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Controls Panel */
    #controls {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      padding: 16px 24px;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      background: linear-gradient(0deg, rgba(5,5,8,0.95) 0%, rgba(5,5,8,0.3) 60%, transparent 100%);
      pointer-events: none; flex-wrap: wrap;
    }
    #controls button {
      pointer-events: auto;
      font-family: 'Orbitron', sans-serif; font-size: 0.55rem;
      letter-spacing: 1.5px; text-transform: uppercase;
      padding: 8px 16px; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 5px; background: rgba(255,255,255,0.03);
      color: #707085; cursor: pointer; transition: all 0.3s;
      backdrop-filter: blur(8px);
    }
    #controls button:hover {
      border-color: rgba(0, 240, 255, 0.4); color: #00f0ff;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.12);
    }
    #controls button.on {
      border-color: rgba(0, 240, 255, 0.6); color: #00f0ff;
      background: rgba(0, 240, 255, 0.05);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
    }
    #controls button.special-btn {
      border-color: rgba(179, 102, 255, 0.3); color: #b366ff;
    }
    #controls button.special-btn:hover {
      border-color: rgba(179, 102, 255, 0.6); color: #b366ff;
      box-shadow: 0 0 12px rgba(179, 102, 255, 0.15);
    }
    #controls button.special-btn.on {
      border-color: rgba(179, 102, 255, 0.65); color: #b366ff;
      background: rgba(179, 102, 255, 0.06);
      box-shadow: 0 0 15px rgba(179, 102, 255, 0.15);
    }
    #controls button.meeting-btn {
      border-color: rgba(255, 51, 153, 0.3); color: #ff3399;
    }
    #controls button.meeting-btn:hover {
      border-color: rgba(255, 51, 153, 0.6); color: #ff3399;
      box-shadow: 0 0 12px rgba(255, 51, 153, 0.15);
    }
    #controls button.meeting-btn.on {
      border-color: rgba(255, 51, 153, 0.65); color: #ff3399;
      background: rgba(255, 51, 153, 0.06);
      box-shadow: 0 0 15px rgba(255, 51, 153, 0.15);
    }

    #fps {
      position: fixed; bottom: 62px; right: 28px; z-index: 10;
      font-family: 'Orbitron', sans-serif; font-size: 0.55rem;
      letter-spacing: 1.5px; color: rgba(255, 255, 255, 0.15);
      pointer-events: none;
    }

    /* Initializing Loader Screen */
    #loader {
      position: fixed; inset: 0; z-index: 100; background: #050508;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 24px; transition: opacity 0.6s;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #loader h2 {
      font-family: 'Orbitron', sans-serif; font-weight: 700;
      font-size: 0.85rem; letter-spacing: 4px; text-transform: uppercase; color: #606075;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      text-align: center;
      line-height: 1.6;
      animation: pulseText 1.6s ease-in-out infinite alternate;
    }
    @keyframes pulseText {
      from { color: #505060; text-shadow: none; }
      to { color: #00f0ff; text-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
    }
    .spinner {
      width: 42px; height: 42px;
      border: 2px solid rgba(0, 240, 255, 0.05); border-top-color: #00f0ff;
      border-radius: 50%; animation: spin 0.75s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.05);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Bypass offline button inside loader */
    #bypass-btn {
      margin-top: 10px;
      font-family: 'Orbitron', sans-serif; font-size: 0.55rem;
      letter-spacing: 2px; text-transform: uppercase;
      padding: 10px 20px; border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 5px; background: rgba(0, 240, 255, 0.05);
      color: #00f0ff; cursor: pointer; transition: all 0.3s;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
      display: none;
    }
    #bypass-btn:hover {
      background: rgba(0, 240, 255, 0.12);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
    }

    /* Meeting Mode Toast Notice */
    #meeting-toast {
      position: fixed; top: 86px; left: 50%; transform: translateX(-50%);
      z-index: 20; padding: 14px 28px; border-radius: 8px;
      background: rgba(10, 10, 15, 0.92); border: 1px solid rgba(255, 51, 153, 0.3);
      font-family: 'Inter', sans-serif; font-size: 0.72rem; color: #a0a0b0;
      backdrop-filter: blur(12px); opacity: 0; transition: opacity 0.4s;
      pointer-events: none; max-width: 500px; text-align: center;
      line-height: 1.6; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #meeting-toast.visible { opacity: 1; }
    #meeting-toast strong { color: #ff3399; letter-spacing: 1px; }
  </style>
</head>
<body>
  <!-- Cyberpunk Init Loader -->
  <div id="loader">
    <div class="spinner"></div>
    <h2 id="loader-title">ENERGY THREADS — INITIALIZING</h2>
    <button id="bypass-btn">Bypass to Offline HUD</button>
  </div>

  <video id="webcam" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <div id="vignette"></div>
  <div id="scanlines"></div>
  <div id="gesture-emoji"></div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-left">
      <h1>Energy Threads</h1>
      <select id="cam-select" class="cam-selector">
        <option value="">Default Camera</option>
      </select>
      
      <!-- Audio Synthwave Player -->
      <div class="cyber-player">
        <button id="player-play" class="player-btn">▶</button>
        <select id="player-track" class="player-select">
          <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">Cyber Grid Track 1</option>
          <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">Synth Shift Track 2</option>
          <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3">Cyber Punk Track 3</option>
          <option value="local">Load Local MP3...</option>
        </select>
        <input type="file" id="local-file" class="file-loader" accept="audio/*">
        <label for="local-file" id="file-label" class="file-loader-label" title="Load Audio">📂</label>
      </div>
    </div>
    
    <div class="hud-right">
      <div id="gesture-badge"></div>
      <div id="status">
        <div id="status-dot"></div>
        <span id="status-text">Scanning…</span>
      </div>
    </div>
  </div>

  <!-- HUD Volume side panel -->
  <div id="vol-wrap">
    <span id="vol-pct">50%</span>
    <div id="vol-fill"></div>
    <span id="vol-label">Volume</span>
  </div>

  <!-- Controls Panel -->
  <div id="controls">
    <button id="btn-threads" class="on">Threads</button>
    <button id="btn-cross">Cross-Hand</button>
    <button id="btn-rain" class="special-btn">Cyber-Rain</button>
    <button id="btn-ink" class="special-btn">Pointer Ink</button>
    <button id="btn-orbit">Orbit Attraction</button>
    <button id="btn-particles">Particles</button>
    <button id="btn-landmarks">Landmarks</button>
    <button id="btn-gestures" class="on">Gestures</button>
    <button id="btn-glitch" class="special-btn">Glitch Feed</button>
    <button id="btn-audio" class="special-btn">Audio Roll</button>
    <button id="btn-meeting" class="meeting-btn">📹 Meeting Mode</button>
  </div>

  <div id="fps">-- FPS</div>

  <!-- Meeting Mode Toast Notice -->
  <div id="meeting-toast">
    <strong>MEETING MODE RUNNING</strong><br>
    All HUD details and overlays cropped for a clean camera sharing feed.<br>
    Select Google Meet → Present → This browser tab.
  </div>

  <!-- MediaPipe dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
  // ═══════════════════════════════════════════
  // CONFIG
  // ═══════════════════════════════════════════
  const CFG = {
    camWidth: 640,
    camHeight: 480,
    smoothFactor: 0.25,
    feedOpacity: 0.70,
    feedSaturation: 0.30,
    feedBrightness: 0.85,
  };

  // ═══════════════════════════════════════════
  // DOM REFS
  // ═══════════════════════════════════════════
  const video        = document.getElementById('webcam');
  const canvas       = document.getElementById('canvas');
  const ctx          = canvas.getContext('2d');
  const loader       = document.getElementById('loader');
  const loaderTitle  = document.getElementById('loader-title');
  const bypassBtn    = document.getElementById('bypass-btn');
  const statusDot    = document.getElementById('status-dot');
  const statusText   = document.getElementById('status-text');
  const fpsEl        = document.getElementById('fps');
  const gestureBadge = document.getElementById('gesture-badge');
  const gestureEmoji = document.getElementById('gesture-emoji');
  const meetingToast = document.getElementById('meeting-toast');
  const camSelect    = document.getElementById('cam-select');

  // Audio refs
  const playBtn      = document.getElementById('player-play');
  const trackSelect  = document.getElementById('player-track');
  const localFile    = document.getElementById('local-file');
  const fileLabel    = document.getElementById('file-label');
  const volWrap      = document.getElementById('vol-wrap');
  const volFill      = document.getElementById('vol-fill');
  const volPct       = document.getElementById('vol-pct');

  // ═══════════════════════════════════════════
  // MUSIC PLAYER SETUP
  // ═══════════════════════════════════════════
  let audioPlayer = new Audio();
  audioPlayer.crossOrigin = "anonymous";
  audioPlayer.src = trackSelect.value;
  audioPlayer.loop = true;
  let isPlaying = false;
  let currentVolume = 0.5;
  audioPlayer.volume = currentVolume;

  playBtn.addEventListener('click', () => {
    if (isPlaying) {
      audioPlayer.pause();
      playBtn.textContent = '▶';
      isPlaying = false;
    } else {
      audioPlayer.play().catch(e => console.log("Playback blocked or failed:", e));
      playBtn.textContent = '⏸';
      isPlaying = true;
    }
  });

  trackSelect.addEventListener('change', () => {
    if (trackSelect.value === 'local') {
      localFile.click();
    } else {
      const playingState = isPlaying;
      audioPlayer.src = trackSelect.value;
      if (playingState) {
        audioPlayer.play().catch(e => console.log("Playback failed:", e));
      }
    }
  });

  localFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const url = URL.createObjectURL(file);
      const playingState = isPlaying;
      
      // Update dropdown option to reflect local file name
      let opt = trackSelect.querySelector('option[value="local"]');
      opt.textContent = `Local: ${file.name.substring(0, 15)}...`;
      
      audioPlayer.src = url;
      if (playingState) {
        audioPlayer.play().catch(e => console.log("Playback failed:", e));
      }
    }
  });

  // Sync volume overlay UI
  function drawVolume(vol) {
    currentVolume = Math.max(0, Math.min(1, vol));
    audioPlayer.volume = currentVolume;
    volFill.style.height = `${currentVolume * 100}%`;
    volPct.textContent = `${Math.round(currentVolume * 100)}%`;
    
    // Electron IPC Master Volume sync
    if (window.electronAPI && typeof window.electronAPI.setVolume === 'function') {
      window.electronAPI.setVolume(currentVolume);
    }
    if (window.electronAPI && typeof window.electronAPI.setSystemVolume === 'function') {
      window.electronAPI.setSystemVolume(currentVolume);
    }
  }

  function hideVolume() {
    volWrap.classList.remove('vis');
  }

  // ═══════════════════════════════════════════
  // VISUAL STATE VARIABLES
  // ═══════════════════════════════════════════
  let showThreads   = true;
  let showCross     = false;
  let showRain      = false;
  let showInk       = false;
  let showOrbit     = false;
  let showParticles = false;
  let showLandmarks = false;
  let showGestures  = true;
  let showGlitch    = false;
  let audioActive   = false;
  let meetingMode   = false;

  let W = 0, H = 0;
  let latestResults  = null;
  let smoothedHands  = [null, null];
  let time = 0;

  // Aspect correct camera feed bounding metrics
  let camX = 0, camY = 0, camW = 0, camH = 0;

  // Gesture Recognition Variables
  let gestureHistory = [];
  let confirmedGesture = 'none';
  let gestureActivatedTime = 0;
  const GESTURE_WINDOW = 8;

  // Visual Cyber-Rain Arrays
  const rainDrops = [];
  const MAX_RAIN = 180;
  const splashes = [];

  // Glowing Pointer Ink Array
  const inkPoints = [];
  const MAX_INK_AGE = 50; // frames
  
  // Custom gravity particles
  const particles = [];
  const MAX_PARTICLES = 160;

  // Wrists separation explosion trigger
  let lastWristDist = 0;
  let explodeCooldown = 0;
  let shakeIntensity = 0;
  let screenFlash = 0;

  // FPS metric
  let frameCount = 0, lastFpsTime = 0;

  // Electron Master Window Switch fist/three-fingers gesture lock
  let windowSwitchCooldown = 0;

  // ═══════════════════════════════════════════
  // UI BINDING TOGGLES
  // ═══════════════════════════════════════════
  function setupToggle(btnId, getter, setter) {
    const btn = document.getElementById(btnId);
    btn.addEventListener('click', () => {
      setter(!getter());
      btn.classList.toggle('on', getter());
    });
  }
  setupToggle('btn-threads',   () => showThreads,   v => showThreads = v);
  setupToggle('btn-cross',     () => showCross,     v => showCross = v);
  setupToggle('btn-rain',      () => showRain,      v => showRain = v);
  setupToggle('btn-ink',       () => showInk,       v => showInk = v);
  setupToggle('btn-orbit',     () => showOrbit,     v => showOrbit = v);
  setupToggle('btn-particles', () => showParticles, v => showParticles = v);
  setupToggle('btn-landmarks', () => showLandmarks, v => showLandmarks = v);
  setupToggle('btn-gestures',  () => showGestures,  v => showGestures = v);
  setupToggle('btn-glitch',    () => showGlitch,    v => showGlitch = v);
  setupToggle('btn-audio',     () => audioActive,   v => {
    audioActive = v;
    if (v) {
      volWrap.classList.add('vis');
    } else {
      volWrap.classList.remove('vis');
    }
  });

  // Meeting Mode
  document.getElementById('btn-meeting').addEventListener('click', () => {
    meetingMode = !meetingMode;
    document.getElementById('btn-meeting').classList.toggle('on', meetingMode);
    meetingToast.classList.toggle('visible', meetingMode);
    
    const hud = document.getElementById('hud');
    const controls = document.getElementById('controls');
    const vignette = document.getElementById('vignette');
    const scanlines = document.getElementById('scanlines');

    if (meetingMode) {
      hud.style.display = 'none';
      controls.style.opacity = '0.35';
      vignette.style.display = 'none';
      scanlines.style.display = 'none';
      fpsEl.style.display = 'none';
      setTimeout(() => meetingToast.classList.remove('visible'), 4000);
    } else {
      hud.style.display = '';
      controls.style.opacity = '';
      vignette.style.display = '';
      scanlines.style.display = '';
      fpsEl.style.display = '';
    }
  });

  // ═══════════════════════════════════════════
  // ASPECT METRIC CENTERING
  // ═══════════════════════════════════════════
  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;

    // Cache camera scaling viewport aspect bounds
    const screenAspect = W / H;
    const camAspect = CFG.camWidth / CFG.camHeight;

    if (screenAspect > camAspect) {
      // Screen is wider than webcam aspect, contain vertically
      camH = H;
      camW = H * camAspect;
      camX = (W - camW) / 2;
      camY = 0;
    } else {
      // Screen is taller than webcam aspect, contain horizontally
      camW = W;
      camH = W / camAspect;
      camX = 0;
      camY = (H - camH) / 2;
    }
  }
  window.addEventListener('resize', resize);
  resize();

  // Webcam hooks for metadata updates
  video.addEventListener('loadedmetadata', resize);
  video.addEventListener('play', resize);

  // ═══════════════════════════════════════════
  // SOLID MARGIN OVERLAYS
  // ═══════════════════════════════════════════
  function drawLetterbox() {
    ctx.fillStyle = '#050508';
    
    // Left border (with 1px overlap)
    if (camX > 0) {
      ctx.fillRect(0, 0, camX + 1, H);
    }
    // Right border (with 1px overlap)
    if (camX > 0) {
      ctx.fillRect(camX + camW - 1, 0, W - (camX + camW) + 1, H);
    }
    // Bottom border (with 1px overlap)
    if (camY > 0) {
      ctx.fillRect(0, camY + camH - 1, W, H - (camY + camH) + 1);
    }
    // Top border (with 1px overlap)
    if (camY > 0) {
      ctx.fillRect(0, 0, W, camY + 1);
    }
  }

  // ═══════════════════════════════════════════
  // COLOR GRAPHING & PALETTES
  // ═══════════════════════════════════════════
  const NEON = [
    [0,   240, 255],   // cyan
    [180, 100, 255],   // purple
    [255, 51,  153],   // hot pink
    [0,   255, 136],   // green
    [255, 200, 0  ],   // gold
    [255, 80,  80 ],   // red
    [100, 255, 218],   // teal
    [255, 130, 255],   // magenta
  ];

  const TIPS = [4, 8, 12, 16, 20];

  const INTRA_PAIRS = [];
  for (let i = 0; i < 5; i++)
    for (let j = i + 1; j < 5; j++)
      INTRA_PAIRS.push([i, j]);

  const CROSS_PAIRS = [];
  for (let i = 0; i < 5; i++)
    for (let j = 0; j < 5; j++)
      CROSS_PAIRS.push([i, j]);

  // ═══════════════════════════════════════════
  // GESTURE CLASSIFIER
  // ═══════════════════════════════════════════
  const GESTURES = {
    rock:         { emoji: '🤘', label: 'STRANGER MODE', color: [255, 30,  0  ] },
    thumbs_up:    { emoji: '👍', label: 'AWESOME',      color: [0,   240, 100] },
    thumbs_down:  { emoji: '👎', label: 'NAH',          color: [255, 50,  50 ] },
    peace:        { emoji: '✌️', label: 'PEACE',        color: [180, 100, 255] },
    middle_finger:{ emoji: '🖕', label: 'CENSORED',     color: [255, 51,  153] },
    open_palm:    { emoji: '🖐️', label: 'HALT',         color: [0,   200, 255] },
    fist:         { emoji: '✊', label: 'SYSTEM SWEEP',  color: [255, 150, 0  ] },
    ok_sign:      { emoji: '👌', label: 'ORBIT ATTRACTION', color: [255, 200, 0] },
    pointing:     { emoji: '☝️', label: 'POINTER INK',  color: [0,   255, 200] },
    three_fingers:{ emoji: '🤟', label: 'SWITCH WINDOW', color: [179, 102, 255] },
  };

  function smoothLandmarks(handIdx, raw) {
    if (!smoothedHands[handIdx]) {
      smoothedHands[handIdx] = raw.map(lm => ({ x: lm.x, y: lm.y, z: lm.z || 0 }));
      return smoothedHands[handIdx];
    }
    const prev = smoothedHands[handIdx];
    const dx = raw[0].x - prev[0].x, dy = raw[0].y - prev[0].y;
    if (dx * dx + dy * dy > 0.035) {
      smoothedHands[handIdx] = raw.map(lm => ({ x: lm.x, y: lm.y, z: lm.z || 0 }));
      return smoothedHands[handIdx];
    }
    const a = 1 - CFG.smoothFactor;
    for (let i = 0; i < 21; i++) {
      prev[i].x += (raw[i].x - prev[i].x) * a;
      prev[i].y += (raw[i].y - prev[i].y) * a;
    }
    return prev;
  }

  function getFingerStates(lm) {
    const isRight = lm[5].x > lm[17].x;
    const thumb = isRight ? (lm[4].x < lm[3].x) : (lm[4].x > lm[3].x);

    const index  = lm[8].y  < lm[6].y;
    const middle = lm[12].y < lm[10].y;
    const ring   = lm[16].y < lm[14].y;
    const pinky  = lm[20].y < lm[18].y;

    const thumbUp   = lm[4].y < lm[3].y && lm[4].y < lm[2].y;
    const thumbDown = lm[4].y > lm[3].y && lm[4].y > lm[2].y;

    // Optimized Pinch OK sign check
    const okPinch = ((lm[4].x-lm[8].x)*(lm[4].x-lm[8].x) + (lm[4].y-lm[8].y)*(lm[4].y-lm[8].y)) < 0.0036;

    return { thumb, index, middle, ring, pinky, thumbUp, thumbDown, okPinch };
  }

  function classifyGesture(lm) {
    const f = getFingerStates(lm);

    if (f.okPinch && f.middle && f.ring) return 'ok_sign';
    if (f.index && f.pinky && !f.middle && !f.ring) return 'rock';
    if (f.middle && !f.index && !f.ring && !f.pinky) return 'middle_finger';
    if (f.index && f.middle && !f.ring && !f.pinky) return 'peace';
    
    // Add three_fingers check:
    const raisedCount = (f.index ? 1 : 0) + (f.middle ? 1 : 0) + (f.ring ? 1 : 0) + (f.pinky ? 1 : 0);
    if (raisedCount === 3 && !f.thumb) return 'three_fingers';

    if (f.index && !f.middle && !f.ring && !f.pinky) return 'pointing';
    if (f.thumb && f.thumbUp && !f.index && !f.middle && !f.ring && !f.pinky) return 'thumbs_up';
    if (f.thumb && f.thumbDown && !f.index && !f.middle && !f.ring && !f.pinky) return 'thumbs_down';
    if (f.thumb && f.index && f.middle && f.ring && f.pinky) return 'open_palm';
    if (!f.thumb && !f.index && !f.middle && !f.ring && !f.pinky) return 'fist';

    return 'none';
  }

  function updateGesture(raw) {
    gestureHistory.push(raw);
    if (gestureHistory.length > GESTURE_WINDOW) gestureHistory.shift();

    const counts = {};
    for (const g of gestureHistory) counts[g] = (counts[g] || 0) + 1;

    let best = 'none', bestCount = 0;
    for (const [g, c] of Object.entries(counts)) {
      if (c > bestCount) { best = g; bestCount = c; }
    }

    const newGesture = bestCount >= Math.ceil(GESTURE_WINDOW * 0.55) ? best : 'none';

    if (newGesture !== confirmedGesture) {
      confirmedGesture = newGesture;
      gestureActivatedTime = time;
    }
    return confirmedGesture;
  }

  // ═══════════════════════════════════════════
  // ATTRACTION PARTICLE ENGINE
  // ═══════════════════════════════════════════
  function spawnParticle(x, y, color) {
    if (particles.length >= MAX_PARTICLES) return;
    const a = Math.random() * 6.283;
    const s = 0.4 + Math.random() * 1.2;
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 1.0, decay: 0.01 + Math.random() * 0.015,
      size: 1.2 + Math.random() * 2.2, color
    });
  }

  function drawParticles(attractor) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      
      // Perform gravity orbit if attractor pinch OK gesture exists
      if (showOrbit && attractor) {
        const dx = attractor.x - p.x;
        const dy = attractor.y - p.y;
        const distSq = dx*dx + dy*dy;
        if (distSq > 100) {
          const dist = Math.sqrt(distSq);
          const pull = 0.58 / dist;
          p.vx += dx * pull;
          p.vy += dy * pull;
          
          // Apply swirling tangential force
          p.vx -= dy * pull * 0.25;
          p.vy += dx * pull * 0.25;
        }
      }

      p.x += p.vx; 
      p.y += p.vy; 
      p.life -= p.decay;

      if (p.life <= 0) { 
        particles.splice(i, 1); 
        continue; 
      }

      ctx.globalAlpha = p.life * 0.65;
      ctx.fillStyle = `rgb(${p.color[0]},${p.color[1]},${p.color[2]})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ═══════════════════════════════════════════
  // Glowing Cyberpunk Draw Helpers
  // ═══════════════════════════════════════════
  function drawGlowLine(x1, y1, x2, y2, color, thick) {
    const [r, g, b] = color;
    const t = thick || 1;

    ctx.lineCap = 'round';
    ctx.globalCompositeOperation = 'lighter';

    ctx.strokeStyle = `rgba(${r},${g},${b},0.05)`;
    ctx.lineWidth = 14 * t;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

    ctx.strokeStyle = `rgba(${r},${g},${b},0.15)`;
    ctx.lineWidth = 5 * t;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

    ctx.strokeStyle = `rgba(${r},${g},${b},0.75)`;
    ctx.lineWidth = 2 * t;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

    ctx.strokeStyle = `rgba(255,255,255,0.45)`;
    ctx.lineWidth = 0.8 * t;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

    ctx.globalCompositeOperation = 'source-over';
  }

  function drawGlowDot(x, y, color, radius) {
    const [r, g, b] = color;
    ctx.globalCompositeOperation = 'lighter';

    ctx.fillStyle = `rgba(${r},${g},${b},0.08)`;
    ctx.beginPath(); ctx.arc(x, y, radius * 3.5, 0, 6.283); ctx.fill();

    ctx.fillStyle = `rgba(${r},${g},${b},0.45)`;
    ctx.beginPath(); ctx.arc(x, y, radius * 1.6, 0, 6.283); ctx.fill();

    ctx.fillStyle = `rgba(${r},${g},${b},0.95)`;
    ctx.beginPath(); ctx.arc(x, y, radius, 0, 6.283); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(x, y, radius * 0.4, 0, 6.283); ctx.fill();

    ctx.globalCompositeOperation = 'source-over';
  }

  // ═══════════════════════════════════════════
  // INTUITIVE GLOWING POINTER INK
  // ═══════════════════════════════════════════
  function updateAndDrawInk(tipsPos, enabled) {
    if (enabled && tipsPos) {
      inkPoints.push({
        x: tipsPos.x,
        y: tipsPos.y,
        age: 0,
        maxAge: MAX_INK_AGE,
        color: [0, 255, 200]
      });
    }

    for (let i = inkPoints.length - 1; i >= 0; i--) {
      inkPoints[i].age++;
      if (inkPoints[i].age >= inkPoints[i].maxAge) {
        inkPoints.splice(i, 1);
      }
    }

    if (inkPoints.length < 2) return;

    const validSegments = [];
    for (let i = 1; i < inkPoints.length; i++) {
      const p1 = inkPoints[i-1];
      const p2 = inkPoints[i];
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      if (dx*dx + dy*dy < 14400) { // Max distance 120 pixels
        validSegments.push({ p1, p2 });
      }
    }

    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalCompositeOperation = 'lighter';

    const passes = [
      { width: 14, alpha: 0.08 },
      { width: 5, alpha: 0.22 },
      { width: 2, alpha: 0.70 }
    ];

    passes.forEach(pass => {
      ctx.lineWidth = pass.width;
      for (let i = 0; i < validSegments.length; i++) {
        const { p1, p2 } = validSegments[i];
        const opacity = (1 - p2.age / p2.maxAge) * pass.alpha;
        ctx.strokeStyle = `rgba(${p2.color[0]}, ${p2.color[1]}, ${p2.color[2]}, ${opacity})`;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
    });

    ctx.strokeStyle = `rgba(255, 255, 255, 0.45)`;
    ctx.lineWidth = 0.8;
    for (let i = 0; i < validSegments.length; i++) {
      const { p1, p2 } = validSegments[i];
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    }

    ctx.restore();
  }

  // ═══════════════════════════════════════════
  // VECTOR PROJECTION DEFLATING CYBER-RAIN
  // ═══════════════════════════════════════════
  function spawnSplash(x, y, color) {
    if (splashes.length > 100) splashes.shift();
    const count = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
      const a = -Math.random() * Math.PI;
      const s = 0.8 + Math.random() * 1.5;
      splashes.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 1.0, decay: 0.02 + Math.random() * 0.03, color
      });
    }
  }

  function updateAndDrawRain(handsData) {
    if (showRain && rainDrops.length < MAX_RAIN) {
      if (Math.random() < 0.8) {
        rainDrops.push({
          x: Math.random() * W,
          y: -10,
          vy: 4 + Math.random() * 6,
          size: 1 + Math.random() * 2,
          alpha: 0.15 + Math.random() * 0.25,
          color: [0, 240, 255]
        });
      }
    }

    for (let i = rainDrops.length - 1; i >= 0; i--) {
      const d = rainDrops[i];
      d.y += d.vy;

      if (d.y > H || d.x < 0 || d.x > W) {
        rainDrops.splice(i, 1);
        continue;
      }

      if (handsData && handsData.length > 0) {
        for (const hand of handsData) {
          for (let k = 0; k < 21; k++) {
            const lm = hand.pts[k];
            const dx = d.x - lm.x;
            const dy = d.y - lm.y;
            const distSq = dx*dx + dy*dy;

            if (distSq < 2025) { // 45px influence
              const isTip = TIPS.includes(k);
              const dist = Math.sqrt(distSq);
              if (dist > 0.1) {
                const invDist = 1 / dist;
                const force = (45 - dist) / 45;
                
                d.x += dx * invDist * force * 5.5;
                d.y += dy * invDist * force * 2.0;

                if (distSq < 225 && isTip && Math.random() < 0.18) {
                  spawnSplash(d.x, d.y, [255, 51, 153]);
                }
              }
            }
          }
        }
      }
      
      ctx.strokeStyle = `rgba(${d.color[0]}, ${d.color[1]}, ${d.color[2]}, ${d.alpha})`;
      ctx.lineWidth = d.size;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x, d.y + 12);
      ctx.stroke();
    }

    ctx.globalCompositeOperation = 'lighter';
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i];
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.08;
      s.life -= s.decay;
      if (s.life <= 0) {
        splashes.splice(i, 1);
        continue;
      }
      ctx.fillStyle = `rgba(${s.color[0]}, ${s.color[1]}, ${s.color[2]}, ${s.life * 0.85})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 1.5, 0, 6.283);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // ═══════════════════════════════════════════
  // GESTURE STAGE SHAKE EXPLOSION
  // ═══════════════════════════════════════════
  function triggerExplosion(x, y) {
    shakeIntensity = 25;
    screenFlash = 0.55;
    
    for (let i = 0; i < 90; i++) {
      const angle = (i / 90) * Math.PI * 2;
      const speed = 2.5 + Math.random() * 4.5;
      const col = NEON[Math.floor(Math.random() * NEON.length)];
      
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1.0,
        decay: 0.008 + Math.random() * 0.008,
        size: 1.8 + Math.random() * 2.8,
        color: col
      });
    }
    explodeCooldown = 65;
  }

  // ═══════════════════════════════════════════
  // SCREEN GESTURE EFFECTS OVERLAYS
  // ═══════════════════════════════════════════
  function drawGestureOverlay(gesture, t) {
    if (gesture === 'none' || !showGestures) return;
    const g = GESTURES[gesture];
    if (!g) return;

    const elapsed = t - gestureActivatedTime;
    const fi = Math.min(elapsed / 320, 1);
    const [r, gr, b] = g.color;
    const pulse = 0.5 + 0.5 * Math.sin(elapsed * 0.005);

    ctx.fillStyle = `rgba(${r},${gr},${b},${0.035 * fi})`;
    ctx.fillRect(camX, camY, camW, camH);

    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(${r},${gr},${b},${0.05 * fi * pulse})`;
    ctx.lineWidth = 20;
    ctx.beginPath();
    ctx.roundRect(camX + 10, camY + 10, camW - 20, camH - 20, 12);
    ctx.stroke();

    ctx.strokeStyle = `rgba(${r},${gr},${b},${0.18 * fi * pulse})`;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.roundRect(camX + 10, camY + 10, camW - 20, camH - 20, 12);
    ctx.stroke();

    ctx.strokeStyle = `rgba(${r},${gr},${b},${0.35 * fi})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.roundRect(camX + 10, camY + 10, camW - 20, camH - 20, 12);
    ctx.stroke();

    ctx.globalCompositeOperation = 'source-over';

    if (gesture === 'rock') drawRockEffect(elapsed, fi, r, gr, b);
    if (gesture === 'thumbs_up') drawThumbsUpEffect(elapsed, fi);
    if (gesture === 'thumbs_down') drawThumbsDownEffect(elapsed, fi, r, gr, b);
    if (gesture === 'peace') drawPeaceEffect(elapsed, fi);
    if (gesture === 'middle_finger') drawChromaticGlitch(elapsed, fi);

    gestureBadge.textContent = `${g.emoji} ${g.label}`;
    gestureBadge.style.setProperty('--gc', `rgb(${r},${gr},${b})`);
    gestureBadge.classList.add('vis');
    gestureEmoji.textContent = g.emoji;
    gestureEmoji.classList.add('vis');
  }

  function clearGestureUI() {
    gestureBadge.classList.remove('vis');
    gestureEmoji.classList.remove('vis');
  }

  function drawRockEffect(elapsed, fi, r, g, b) {
    ctx.globalCompositeOperation = 'lighter';
    if (Math.random() < 0.18 * fi) {
      const sx = camX + Math.random() * camW;
      const sy = camY;
      ctx.strokeStyle = `rgba(${r},${g},${b},${0.65 * fi})`;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      let cx = sx, cy = sy;
      const segments = 6 + Math.floor(Math.random() * 5);
      const stepY = camH / segments;
      for (let i = 0; i < segments; i++) {
        cx += (Math.random() - 0.5) * 110;
        cy += stepY;
        ctx.lineTo(cx, cy);
      }
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawThumbsUpEffect(elapsed, fi) {
    if (Math.random() < 0.22 * fi) {
      const rx = camX + Math.random() * camW;
      spawnParticle(rx, camY + camH, [0, 240, 100]);
      const p = particles[particles.length - 1];
      if (p) {
        p.vy = -(2.5 + Math.random() * 3.5);
        p.vx = (Math.random() - 0.5) * 2;
      }
    }
  }

  function drawThumbsDownEffect(elapsed, fi, r, g, b) {
    if (Math.random() < 0.25 * fi) {
      const rx = camX + Math.random() * camW;
      spawnParticle(rx, camY, [r, g, b]);
      const p = particles[particles.length - 1];
      if (p) {
        p.vy = 3.5 + Math.random() * 4.0;
        p.vx = 0;
        p.decay = 0.006;
      }
    }
  }

  function drawPeaceEffect(elapsed, fi) {
    const gr2 = ctx.createLinearGradient(camX, camY, camX + camW, camY + camH);
    const off = (elapsed * 0.001) % 1;
    const cols = ['rgba(255,0,0,.015)','rgba(255,165,0,.015)','rgba(255,255,0,.015)','rgba(0,255,0,.015)','rgba(0,0,255,.015)','rgba(128,0,255,.015)'];
    cols.forEach((c,i)=>{gr2.addColorStop((i/cols.length+off)%1,c);});
    ctx.globalAlpha = fi;
    ctx.fillStyle = gr2;
    ctx.fillRect(camX, camY, camW, camH);
    ctx.globalAlpha = 1;
  }

  function drawChromaticGlitch(elapsed, fi) {
    if (camW <= 0 || camH <= 0) return;
    const slices = 3 + Math.floor(Math.random() * 5);
    const intensity = fi * 0.85;
    for (let i = 0; i < slices; i++) {
      const sy = camY + Math.random() * camH;
      const sh = 3 + Math.random() * 20;
      const shift = (Math.random() - 0.5) * 45 * intensity;
      ctx.drawImage(canvas, camX, sy, camW, sh, camX + shift, sy, camW, sh);
    }
    if (Math.random() < 0.22) {
      ctx.fillStyle = `rgba(255, 51, 153, ${0.05 * fi})`;
      ctx.fillRect(camX, camY, camW, camH);
    }
  }

  function updateFps(now) {
    frameCount++;
    if (now - lastFpsTime >= 1000) {
      fpsEl.textContent = `${frameCount} FPS`;
      frameCount = 0;
      lastFpsTime = now;
    }
  }

  // ═══════════════════════════════════════════
  // MAIN FRAME LOOP RENDER
  // ═══════════════════════════════════════════
  function render() {
    requestAnimationFrame(render);
    const now = performance.now();
    time = now;
    updateFps(now);

    if (explodeCooldown > 0) explodeCooldown--;
    if (windowSwitchCooldown > 0) windowSwitchCooldown--;

    ctx.save();
    if (shakeIntensity > 0.05) {
      const sx = (Math.random() - 0.5) * shakeIntensity;
      const sy = (Math.random() - 0.5) * shakeIntensity;
      ctx.translate(sx, sy);
      shakeIntensity *= 0.90;
    }

    ctx.fillStyle = '#050508';
    ctx.fillRect(camX, camY, camW, camH);

    ctx.save();
    ctx.filter = `saturate(${CFG.feedSaturation}) brightness(${CFG.feedBrightness})`;
    ctx.globalAlpha = CFG.feedOpacity;
    ctx.translate(W, 0); ctx.scale(-1, 1);
    
    const mirX = W - camX - camW;
    ctx.drawImage(video, 0, 0, video.videoWidth || CFG.camWidth, video.videoHeight || CFG.camHeight, mirX, camY, camW, camH);
    ctx.restore();

    const isGlitching = showGlitch || (confirmedGesture === 'middle_finger' && showGestures) || explodeCooldown > 35;
    if (isGlitching) {
      drawChromaticGlitch(now, 1.0);
    }

    if (camW > 0 && camH > 0) {
      const gradeGrad = ctx.createLinearGradient(camX, camY, camX + camW, camY + camH);
      gradeGrad.addColorStop(0, 'rgba(0, 240, 255, 0.08)');  
      gradeGrad.addColorStop(0.5, 'rgba(179, 102, 255, 0.08)'); 
      gradeGrad.addColorStop(1, 'rgba(255, 51, 153, 0.12)');  
      ctx.fillStyle = gradeGrad;
      ctx.fillRect(camX, camY, camW, camH);
      
      ctx.fillStyle = 'rgba(5, 5, 8, 0.18)';
      ctx.fillRect(camX, camY, camW, camH);
    }

    const r = latestResults;
    const activeHandsData = [];
    let primaryTip = null;
    let pinchCenter = null;

    if (!r || !r.multiHandLandmarks || r.multiHandLandmarks.length === 0) {
      clearGestureUI();
      smoothedHands[0] = null;
      smoothedHands[1] = null;
      gestureHistory = [];
      if (confirmedGesture !== 'none') confirmedGesture = 'none';

      updateAndDrawRain(null);
      updateAndDrawInk(null, false);
      if (showParticles && particles.length > 0) drawParticles(null);
      hideVolume();
    } else {
      const hc = r.multiHandLandmarks.length;
      statusDot.classList.toggle('active', true);
      statusText.textContent = hc === 1 ? '1 Hand' : `${hc} Hands`;

      let handDist = 0;
      if (hc >= 2) {
        const w0 = smoothLandmarks(0, r.multiHandLandmarks[0])[0];
        const w1 = smoothLandmarks(1, r.multiHandLandmarks[1])[0];
        handDist = Math.hypot((w0.x - w1.x) * W, (w0.y - w1.y) * H);

        if (lastWristDist > 0 && lastWristDist < 160 && handDist > 270 && explodeCooldown === 0) {
          const midX = ((1 - w0.x) * W + (1 - w1.x) * W) / 2;
          const midY = (w0.y * H + w1.y * H) / 2;
          triggerExplosion(midX, midY);
        }
        lastWristDist = handDist;
      } else {
        lastWristDist = 0;
      }

      for (let h = 0; h < hc; h++) {
        const raw = r.multiHandLandmarks[h];
        const smoothed = smoothLandmarks(h, raw);

        const pts = smoothed.map(lm => ({
          x: camX + (1 - lm.x) * camW,
          y: camY + lm.y * camH
        }));

        const tips = TIPS.map(ti => pts[ti]);
        activeHandsData.push({ pts, tips });

        if (h === 0) {
          primaryTip = tips[1]; 
          pinchCenter = {
            x: (pts[4].x + pts[8].x) / 2,
            y: (pts[4].y + pts[8].y) / 2
          };
        }

        if (showThreads) {
          for (let pi = 0; pi < INTRA_PAIRS.length; pi++) {
            const [ai, bi] = INTRA_PAIRS[pi];
            const a = tips[ai], b = tips[bi];
            const color = NEON[(pi + h * 5) % NEON.length];
            drawGlowLine(a.x, a.y, b.x, b.y, color, 1.0);

            if (showParticles && Math.random() < 0.12) {
              const t = Math.random();
              spawnParticle(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, color);
            }
          }
        }

        if (showLandmarks) {
          for (let i = 0; i < 21; i++) {
            const isTip = TIPS.includes(i);
            const color = isTip ? NEON[TIPS.indexOf(i)] : [80, 80, 110];
            const radius = isTip ? 5.5 : 2.0;
            if (isTip) {
              drawGlowDot(pts[i].x, pts[i].y, color, radius);
            } else {
              ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},0.5)`;
              ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, radius, 0, 6.283); ctx.fill();
            }
          }
          const CONNECTIONS = [
            [0,1],[1,2],[2,3],[3,4],       
            [0,5],[5,6],[6,7],[7,8],       
            [5,9],[9,10],[10,11],[11,12],   
            [9,13],[13,14],[14,15],[15,16], 
            [13,17],[17,18],[18,19],[19,20],
            [0,17],                         
          ];
          ctx.strokeStyle = 'rgba(80,80,110,0.3)';
          ctx.lineWidth = 1;
          for (const [a, b] of CONNECTIONS) {
            ctx.beginPath(); ctx.moveTo(pts[a].x, pts[a].y); ctx.lineTo(pts[b].x, pts[b].y); ctx.stroke();
          }
        }

        if (showParticles) {
          for (let ti = 0; ti < 5; ti++) {
            if (Math.random() < 0.28) spawnParticle(tips[ti].x, tips[ti].y, NEON[ti]);
          }
        }
      }

      if (showCross && hc >= 2) {
        const t0 = activeHandsData[0].tips;
        const t1 = activeHandsData[1].tips;
        for (let ci = 0; ci < CROSS_PAIRS.length; ci++) {
          const [ai, bi] = CROSS_PAIRS[ci];
          const a = t0[ai], b = t1[bi];
          const color = NEON[ci % NEON.length];
          drawGlowLine(a.x, a.y, b.x, b.y, color, 0.7);
        }
      }

      if (audioActive) {
        if (hc >= 2) {
          const w0 = activeHandsData[0].pts[0];
          const w1 = activeHandsData[1].pts[0];
          const lh = w0.x < w1.x ? w0 : w1;
          const rh = w0.x < w1.x ? w1 : w0;
          const angle = Math.atan2(rh.y - lh.y, rh.x - lh.x);
          let norm = Math.max(0, Math.min(1, 0.5 - (angle / (Math.PI / 3))));
          drawVolume(norm);
        } else if (hc === 1) {
          const pts = activeHandsData[0].pts;
          const p0 = pts[0]; 
          const p9 = pts[9]; 
          const angle = Math.atan2(p9.y - p0.y, p9.x - p0.x);
          const minAngle = -3 * Math.PI / 4;
          const maxAngle = -Math.PI / 4;
          let norm = (angle - minAngle) / (maxAngle - minAngle);
          norm = Math.max(0, Math.min(1, norm));
          drawVolume(norm);
        }
      } else {
        hideVolume();
      }

      if (showGestures) {
        const stable = updateGesture(classifyGesture(r.multiHandLandmarks[0]));
        drawGestureOverlay(stable, now);
        
        if ((stable === 'three_fingers' || stable === 'fist') && windowSwitchCooldown === 0) {
          if (window.electronAPI && typeof window.electronAPI.switchWindow === 'function') {
            window.electronAPI.switchWindow();
          }
          windowSwitchCooldown = 50; 
        }

        if (stable === 'none') clearGestureUI();
      } else {
        clearGestureUI();
      }
    }

    if (showParticles) {
      drawParticles((confirmedGesture === 'ok_sign' && showOrbit) ? pinchCenter : null);
    }

    updateAndDrawRain(activeHandsData);
    updateAndDrawInk(primaryTip, showInk && confirmedGesture === 'pointing');

    if (screenFlash > 0.005) {
      ctx.fillStyle = `rgba(255, 255, 255, ${screenFlash})`;
      ctx.fillRect(camX, camY, camW, camH);
      screenFlash *= 0.85;
    }

    ctx.restore();
    drawLetterbox();
  }

  const hands = new Hands({
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 0,
    minDetectionConfidence: 0.65,
    minTrackingConfidence: 0.55
  });

  hands.onResults(results => {
    latestResults = results;
  });

  let cameraInstance = null;

  async function startWebcam(deviceId = null) {
    if (cameraInstance) {
      await cameraInstance.stop();
    }
    
    const constraints = {
      video: {
        width: CFG.camWidth,
        height: CFG.camHeight,
        facingMode: 'user'
      }
    };
    if (deviceId) {
      constraints.video.deviceId = { exact: deviceId };
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      await video.play();

      cameraInstance = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: CFG.camWidth,
        height: CFG.camHeight
      });
      await cameraInstance.start();
    } catch (err) {
      console.error("Failed to start webcam:", err);
      loaderTitle.innerHTML = 'Webcam Initialization Failed<br><span style="font-size:0.6rem;color:#ff3399">Check system permissions or select another camera</span>';
      loader.querySelector('.spinner').style.display = 'none';
      bypassBtn.style.display = 'block';
    }
  }

  async function init() {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
        throw new Error("Webcam APIs not supported. Try serving on localhost or secure HTTPS.");
      }
      
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(d => d.kind === 'videoinput');
      
      camSelect.innerHTML = '';
      videoDevices.forEach((d, i) => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || `Webcam ${i + 1}`;
        camSelect.appendChild(opt);
      });

      const defaultId = videoDevices.length > 0 ? videoDevices[0].deviceId : null;
      await startWebcam(defaultId);
      
      camSelect.addEventListener('change', () => {
        if (camSelect.value) {
          startWebcam(camSelect.value);
        }
      });

      setTimeout(() => loader.classList.add('hidden'), 600);
      lastFpsTime = performance.now();
      requestAnimationFrame(render);
    } catch (e) {
      console.error(e);
      loaderTitle.innerHTML = 'Webcam Access Denied / Blocked<br><span style="font-size:0.6rem;color:#ff3399">Ensure localhost or HTTPS environment</span>';
      loader.querySelector('.spinner').style.display = 'none';
      bypassBtn.style.display = 'block';
    }
  }

  bypassBtn.addEventListener('click', () => {
    loader.classList.add('hidden');
    lastFpsTime = performance.now();
    requestAnimationFrame(render);
  });

  init();
  </script>
</body>
